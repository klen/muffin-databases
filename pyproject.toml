[project]
name = "muffin-databases"
version = "0.7.0"
description = "Async support for a range of databases for Muffin framework"
authors = [{ name = "Kirill Klenov", email = "horneds@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.rst"
license = "MIT"
keywords = ["sql", "postgres", "mysql", "sqlite", "asyncio", "asgi", "web", "muffin"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Framework :: AsyncIO",
]
dependencies = [
  "databases",
  "muffin",
]

[project.optional-dependencies]
sqlite = ["aiosqlite"]
postgres = ["asyncpg"]
mysql = ["aiomysql"]

[project.urls]
Homepage = "https://github.com/klen/muffin-databases"
Repository = "https://github.com/klen/muffin-databases"

[dependency-groups]
dev = [
  "aiosqlite",
  "pytest",
  "pytest-aio[curio, trio]",
  "ruff",
  "pyrefly",
  "pre-commit",
]
example = ["uvicorn"]

[tool.uv]
default-groups = ["dev", "example"]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "muffin_databases"
module-root = ""

[tool.pytest.ini_options]
addopts = "-xsv tests.py"
log_cli = true

[tool.pyrefly]
project-includes = ["muffin_databases"]
project-excludes = ["tests.py", "example.py", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "docs", "examples"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A003",
  "ANN",
  "ARG",
  "COM",
  "CPY001",
  "D",
  "DJ",
  "EM",
  "FA100",
  "FIX",
  "N",
  "PLC0415",
  "PLR0912",
  "PLR2004",
  "RET",
  "RSE",
  "RUF012",
  "S101",
  "SLF",
  "TD",
  "TRY003",
  "UP",
]

[tool.bumpversion]
current_version = "0.7.0"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
