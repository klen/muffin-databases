name: release

on:
  push:
    tags: ["*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Test
        run: |
          uv sync --locked --all-extras --dev
          uv run pytest

      - name: Build Package
        run: |
          uv build
          uv publish --token ${{ secrets.pypy }}
