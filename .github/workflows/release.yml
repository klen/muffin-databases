name: release

on:
  workflow_run:
    workflows: [tests]
    branches: [master]
    types: [completed]

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@main
      - uses: astral-sh/setup-uv@main
        with:
          enable-cache: true

      - name: Build Package
        run: |
          uv build
          uv publish --token ${{ secrets.pypy }}

  notify:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Notify Success
        uses: archive/github-actions-slack@master
        with:
          slack-channel: C2CRL4C4V
          slack-text: "*[${{ github.repository }}]* build is success *(${{ github.ref }})* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          slack-bot-user-oauth-access-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-optional-as_user: false
          slack-optional-icon_emoji: ":white_check_mark:"
