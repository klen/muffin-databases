name: release

on:
  push:
    tags: ["*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Test
        run: |
          uv sync --locked --all-extras --dev
          uv run pytest

      - name: Build Package
        run: |
          uv build
          uv publish --token ${{ secrets.pypy }}

  notify:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Notify Success
        uses: archive/github-actions-slack@433fef9978d3adae73168bfc9c5a7ce722780231
        with:
          slack-channel: C2CRL4C4V
          slack-text: "*[${{ github.repository }}]* build is success *(${{ github.ref }})* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          slack-bot-user-oauth-access-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-optional-as_user: false
          slack-optional-icon_emoji: ":white_check_mark:"
